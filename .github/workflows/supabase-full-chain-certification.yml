name: Supabase full migration-chain certification
# Changes to adoption tooling are intentionally included in this required check.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli-process-transport:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/database/supabase-cli-process.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism

  fresh-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase and apply the complete chain
        run: |
          supabase start
          supabase db reset --local --no-seed
      - name: Verify the migration ledger contains every local migration
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
      - name: Certify legacy-ledger adoption tooling against the disposable clean chain
        run: |
          node scripts/export-legacy-adoption-manifest.mjs --output .j10-adoption/canonical.json --artifact-output .j10-adoption/canonical-manifest-artifact.json --source-sha "$GITHUB_SHA"
          test -s .j10-adoption/canonical.json
          test -s .j10-adoption/canonical-manifest-artifact.json
          npx vitest run tests/database/legacy-production-adoption.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Upload immutable non-secret canonical manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-schema-manifest-${{ github.sha }}
          path: .j10-adoption/canonical-manifest-artifact.json
          if-no-files-found: error
          retention-days: 90
      - name: Certify official repair against a representative ledgerless schema
        run: |
          supabase db query --local "DELETE FROM supabase_migrations.schema_migrations"
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          test "$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'SELECT count(*) FROM supabase_migrations.schema_migrations')" = "0"
          versions=$(find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)
          supabase migration repair --local --status applied $versions
          repaired_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'SELECT count(*) FROM supabase_migrations.schema_migrations')
          test "$repaired_count" -eq "$(echo "$versions" | wc -l)"
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-credential-envelope-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase and preload linked-reset residue
        run: |
          supabase start
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/legacy-integration-credential-envelope-residue.sql
      - name: Apply the complete chain over legacy credential residue
        run: supabase db reset --local --no-seed
      - name: Verify ledger and restored credential-envelope contract
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
          supabase db query --local --file supabase/tests/verify-integration-credential-envelope.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-telegram-type-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase and preload the orphan composite type
        run: |
          supabase start
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/legacy-telegram-business-connections-type-residue.sql
      - name: Apply the complete chain over the orphan composite type
        run: supabase db reset --local --no-seed
      - name: Verify ledger and Telegram table/type contract
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
          supabase db query --local --file supabase/tests/verify-telegram-business-connections-type-residue.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
