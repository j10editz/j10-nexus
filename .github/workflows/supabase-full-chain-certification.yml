name: Supabase full migration-chain certification

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-full-chain-certification.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  fresh-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase and apply the complete chain
        run: |
          supabase start
          supabase db reset --local --no-seed
      - name: Verify the migration ledger contains every local migration
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-credential-envelope-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase and preload linked-reset residue
        run: |
          supabase start
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/legacy-integration-credential-envelope-residue.sql
      - name: Apply the complete chain over legacy credential residue
        run: supabase db reset --local --no-seed
      - name: Verify ledger and restored credential-envelope contract
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
          supabase db query --local --file supabase/tests/verify-integration-credential-envelope.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-telegram-type-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable local Supabase and preload the orphan composite type
        run: |
          supabase start
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/legacy-telegram-business-connections-type-residue.sql
      - name: Apply the complete chain over the orphan composite type
        run: supabase db reset --local --no-seed
      - name: Verify ledger and Telegram table/type contract
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
          supabase db query --local --file supabase/tests/verify-telegram-business-connections-type-residue.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
