name: Supabase full migration-chain certification
# Changes to adoption tooling are intentionally included in this required check.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli-process-transport:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/database/supabase-cli-process.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism

  fresh-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase and apply the complete chain
        run: |
          supabase start
          supabase db reset --local --no-seed
          set -a
          source <(supabase status -o env)
          set +a
          {
            echo "J10_TRIAL_CERT_DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Verify the migration ledger contains every local migration
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
      - name: Export disposable database connection for trial-contract certification
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          {
            echo "J10_TRIAL_CERT_DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Certify trial expiry, paid access, tenant isolation, and provider isolation
        run: npx vitest run tests/database/postgres-trial-contract-certification.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Build the canonical through-20261013 adoption database
        run: |
          # The full-chain reset above certifies every migration. Adoption itself
          # compares Production only with the historically adopted cutoff, so
          # export from a separate disposable reset that excludes forward work.
          mkdir -p .j10-adoption/deferred-migrations
          find supabase/migrations -maxdepth 1 -type f -name '2026101[4-9]_*.sql' -exec mv {} .j10-adoption/deferred-migrations/ \;
          supabase db reset --local --no-seed
      - name: Certify legacy-ledger adoption tooling against the cutoff database
        run: |
          node scripts/export-legacy-adoption-manifest.mjs --output .j10-adoption/canonical.json --artifact-output .j10-adoption/canonical-manifest-artifact.json --source-sha "$GITHUB_SHA"
          node scripts/export-canonical-function-reconciliation-plan.mjs --private-output .j10-adoption/canonical-function-plan.private.json --attestation-output .j10-adoption/canonical-function-plan-attestation.json
          test -s .j10-adoption/canonical.json
          test -s .j10-adoption/canonical-manifest-artifact.json
          test -s .j10-adoption/canonical-function-plan.private.json
          test -s .j10-adoption/canonical-function-plan-attestation.json
          npx vitest run tests/database/legacy-production-adoption.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
          npx vitest run tests/database/canonical-function-reconciliation-plan.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Export selected executed structural definitions for private reconciliation planning
        run: |
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          : > .j10-adoption/canonical-structural-definitions.private.sql
          for relation in automation_steps automation_run_steps subscription_events_ledger crm_contacts_legacy_archive_tier0f employees integrations integration_credentials integration_webhook_endpoints integration_webhook_events integration_action_executions integration_operation_logs integration_provider_subscriptions integration_status_history; do
            docker exec "$db_container" pg_dump -U postgres -d postgres --schema-only --table="public.$relation" >> .j10-adoption/canonical-structural-definitions.private.sql
          done
          node scripts/verify-private-structural-definition-export.mjs --input .j10-adoption/canonical-structural-definitions.private.sql
          test -s .j10-adoption/canonical-structural-definitions.private.sql
          node scripts/build-canonical-structural-installer-plan.mjs \
            --plan .j10-adoption/canonical-function-plan.private.json \
            --definitions .j10-adoption/canonical-structural-definitions.private.sql \
            --output .j10-adoption/canonical-structural-installer.private.json
          test -s .j10-adoption/canonical-structural-installer.private.json
      - name: Prove canonical structural installation is idempotent and non-operational
        run: |
          node scripts/apply-canonical-structural-reconciliation-plan.mjs --plan .j10-adoption/canonical-structural-installer.private.json --local
          node scripts/apply-canonical-structural-reconciliation-plan.mjs --plan .j10-adoption/canonical-structural-installer.private.json --local
      - name: Restore forward migrations after cutoff export
        if: always()
        run: mv .j10-adoption/deferred-migrations/*.sql supabase/migrations/ 2>/dev/null || true
      - name: Upload immutable non-secret canonical manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-schema-manifest-${{ github.sha }}
          path: .j10-adoption/canonical-manifest-artifact.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload non-secret function-plan attestation
        uses: actions/upload-artifact@v4
        with:
          name: canonical-function-plan-attestation-${{ github.sha }}
          path: .j10-adoption/canonical-function-plan-attestation.json
          if-no-files-found: error
          retention-days: 90
      - name: Certify official repair against a representative ledgerless schema
        run: |
          supabase db query --local "DELETE FROM supabase_migrations.schema_migrations"
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          test "$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'SELECT count(*) FROM supabase_migrations.schema_migrations')" = "0"
          versions=$(find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)
          supabase migration repair --local --status applied $versions
          repaired_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc 'SELECT count(*) FROM supabase_migrations.schema_migrations')
          test "$repaired_count" -eq "$(echo "$versions" | wc -l)"
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-credential-envelope-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase and preload linked-reset residue
        run: |
          supabase start
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/legacy-integration-credential-envelope-residue.sql
      - name: Apply the complete chain over legacy credential residue
        run: supabase db reset --local --no-seed
      - name: Verify ledger and restored credential-envelope contract
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
          supabase db query --local --file supabase/tests/verify-integration-credential-envelope.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  legacy-telegram-type-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start disposable local Supabase and preload the orphan composite type
        run: |
          supabase start
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/legacy-telegram-business-connections-type-residue.sql
      - name: Apply the complete chain over the orphan composite type
        run: supabase db reset --local --no-seed
      - name: Verify ledger and Telegram table/type contract
        run: |
          local_count=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          remote_count=$(docker exec "$db_container" psql -U postgres -d postgres -tAc \
            'select count(*) from supabase_migrations.schema_migrations')
          test "$local_count" -eq "$remote_count"
          supabase db query --local --file supabase/tests/verify-telegram-business-connections-type-residue.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  retained-data-transfer-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Build an empty canonical target database
        run: |
          supabase start
          supabase db reset --local --no-seed
      - name: Run retained-data transfer rehearsal twice and reject accidental replay
        run: |
          prepare_source() {
            db_container=$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)
            test -n "$db_container"
            docker exec "$db_container" createdb -U supabase_admin -T template0 j10_retained_source
            docker exec "$db_container" sh -c 'pg_dump -U supabase_admin -d postgres --schema-only --no-owner --no-privileges --exclude-extension=pg_cron --exclude-extension=pg_net | psql -q -v ON_ERROR_STOP=1 -U supabase_admin -d j10_retained_source'
            docker exec "$db_container" sh -c 'pg_dump -U supabase_admin -d postgres --data-only --table=supabase_migrations.schema_migrations | psql -q -v ON_ERROR_STOP=1 -U supabase_admin -d j10_retained_source'
          }
          set -a
          source <(supabase status -o env)
          set +a
          export J10_TRANSFER_SOURCE_PROJECT_REF=local-source
          export J10_TRANSFER_TARGET_PROJECT_REF=local-target
          export J10_TRANSFER_TARGET_DB_URL="$DB_URL"
          export J10_TRANSFER_SOURCE_DB_URL="${DB_URL%/postgres}/j10_retained_source"
          export J10_TRANSFER_TARGET_API_URL="$API_URL"
          export J10_TRANSFER_TARGET_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export J10_INTEGRATION_ENCRYPTION_KEY="MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
          prepare_source
          node scripts/rehearse-retained-data-transfer.mjs --allow-local-fixture --seed-fixture
          supabase db reset --local --no-seed
          prepare_source
          node scripts/rehearse-retained-data-transfer.mjs --allow-local-fixture --seed-fixture
          if node scripts/rehearse-retained-data-transfer.mjs --allow-local-fixture; then
            echo 'unexpected retained-data replay success' >&2
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
